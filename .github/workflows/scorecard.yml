name: Scorecard supply-chain security

# DevSecOps: evalúa la higiene de seguridad del repositorio (rama protegida,
# dependabot, pinning de acciones, SAST, etc.) y publica el resultado en
# Code Scanning de GitHub. Configuración de ejemplo en:
# https://securityscorecards.dev/

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 7 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      # DevSecOps: acciones pineadas por SHA (inmutable) para endurecer la cadena de suministro.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: results.sarif
