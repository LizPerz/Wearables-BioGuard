name: Mobile App Security (MobSF)

# DevSecOps: análisis estático del APK compilado (permisos, SDK embebidos,
# código inseguro, malware) con MobSF. Se ejecuta de forma manual o semanal;
# no bloquea push/PR para no frenar el desarrollo.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  mobsf-scan:
    name: MobSF static analysis del APK
    runs-on: ubuntu-latest
    steps:
      # DevSecOps: acciones pineadas por SHA (inmutable) para endurecer la cadena de suministro.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug

      - name: Analizar APK con MobSF (Docker)
        env:
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
        run: |
          set -euo pipefail
          # Si no hay secret configurado, se genera una clave efímera para el contenedor.
          if [ -z "${MOBSF_API_KEY:-}" ]; then
            MOBSF_API_KEY="bioguard-$(openssl rand -hex 32)"
          fi

          docker run -d --name mobsf -p 8000:8000 \
            -e "MOBSF_API_KEY=${MOBSF_API_KEY}" \
            -e "MOBSF_API_ONLY=1" \
            ghcr.io/mobsf/mobsf:v4.5.2

          echo "Esperando a que MobSF arranque..."
          ready=""
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:8000 > /dev/null 2>&1; then
              ready="1"; break
            fi
            sleep 5
          done
          if [ -z "${ready}" ]; then
            echo "MobSF no arrancó a tiempo"; exit 1
          fi

          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Analizando: ${APK}"
          HASH=$(curl -sf -F "file=@${APK}" \
            http://localhost:8000/api/v1/upload \
            -H "Authorization: ${MOBSF_API_KEY}" | jq -r .hash)

          curl -sf -X POST http://localhost:8000/api/v1/scan \
            --data-urlencode "scan_type=apk" \
            --data-urlencode "file_name=$(basename "${APK}")" \
            --data-urlencode "hash=${HASH}" \
            -H "Authorization: ${MOBSF_API_KEY}" > /dev/null

          curl -sf -X POST http://localhost:8000/api/v1/report_json \
            --data-urlencode "hash=${HASH}" \
            -H "Authorization: ${MOBSF_API_KEY}" \
            --output mobsf-report.json

          docker stop mobsf > /dev/null 2>&1 || true

      - name: Upload reporte MobSF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobsf-report
          path: mobsf-report.json
          if-no-files-found: ignore
