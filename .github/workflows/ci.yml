name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint (SAST - Android Lint)
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug

      - name: Restaurar keystore de release (si BIOGUARD_KEYSTORE_BASE64 está definido)
        id: keystore
        shell: bash
        run: |
          if [ -n "${BIOGUARD_KEYSTORE_BASE64:-}" ]; then
            echo "${BIOGUARD_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/bioguard-release.keystore"
            echo "store_file=${RUNNER_TEMP}/bioguard-release.keystore" >> "${GITHUB_OUTPUT}"
            echo "Keystore de release restaurado en el runner."
          else
            echo "Sin BIOGUARD_KEYSTORE_BASE64: la APK release quedará SIN firmar."
            echo "store_file=" >> "${GITHUB_OUTPUT}"
          fi
        env:
          BIOGUARD_KEYSTORE_BASE64: ${{ secrets.BIOGUARD_KEYSTORE_BASE64 }}

      - name: Build APK release (R8 + firma si hay secretos)
        run: ./gradlew :app:assembleRelease
        env:
          BIOGUARD_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          BIOGUARD_STORE_PASSWORD: ${{ secrets.BIOGUARD_STORE_PASSWORD }}
          BIOGUARD_KEY_ALIAS: ${{ secrets.BIOGUARD_KEY_ALIAS }}
          BIOGUARD_KEY_PASSWORD: ${{ secrets.BIOGUARD_KEY_PASSWORD }}

      - name: Upload reporte de lint
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload resultados de tests
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  dependency-scan:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Escanear vulnerabilidades de dependencias (NVD)
        run: ./gradlew dependencyCheckAnalyze --info
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload reporte de Dependency-Check
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          if-no-files-found: ignore
