name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test y lint
    runs-on: ubuntu-latest
    steps:
      # DevSecOps: acciones pineadas por SHA (inmutable) para endurecer la cadena de suministro.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # DevSecOps: valida la integridad de gradle-wrapper.jar versionado en el repo.
      - uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Lint (SAST - Android Lint)
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug

      - name: Restaurar keystore de release (si BIOGUARD_KEYSTORE_BASE64 está definido)
        id: keystore
        shell: bash
        run: |
          if [ -n "${BIOGUARD_KEYSTORE_BASE64:-}" ]; then
            echo "${BIOGUARD_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/bioguard-release.keystore"
            echo "store_file=${RUNNER_TEMP}/bioguard-release.keystore" >> "${GITHUB_OUTPUT}"
            echo "Keystore de release restaurado en el runner."
          else
            echo "Sin BIOGUARD_KEYSTORE_BASE64: la APK release quedará SIN firmar."
            echo "store_file=" >> "${GITHUB_OUTPUT}"
          fi
        env:
          BIOGUARD_KEYSTORE_BASE64: ${{ secrets.BIOGUARD_KEYSTORE_BASE64 }}

      - name: Build APK release (R8 + firma si hay secretos)
        run: ./gradlew :app:assembleRelease
        env:
          BIOGUARD_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          BIOGUARD_STORE_PASSWORD: ${{ secrets.BIOGUARD_STORE_PASSWORD }}
          BIOGUARD_KEY_ALIAS: ${{ secrets.BIOGUARD_KEY_ALIAS }}
          BIOGUARD_KEY_PASSWORD: ${{ secrets.BIOGUARD_KEY_PASSWORD }}

      - name: Upload reporte de lint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload resultados de tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload mapping file de R8 (release, para trazas de producción)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: ignore

  dependency-scan:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Escanear vulnerabilidades de dependencias (NVD)
        run: ./gradlew dependencyCheckAnalyze --info
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload reporte de Dependency-Check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          retention-days: 30
          if-no-files-found: ignore

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Generar SBOM CycloneDX
        run: ./gradlew :app:cyclonedxBom

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: app/build/reports/bom/*.json
          retention-days: 30
          if-no-files-found: ignore
