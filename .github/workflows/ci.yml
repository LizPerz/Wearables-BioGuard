name: Wearable CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: wear-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Static analysis
        run: ./gradlew lintDebug --no-daemon

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wearable-unit-test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/reports/cyclonedx/

  build:
    name: Build release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Restore shared signing keystore
        env:
          BIOGUARD_KEYSTORE_BASE64: ${{ secrets.BIOGUARD_KEYSTORE_BASE64 }}
        run: |
          test -n "$BIOGUARD_KEYSTORE_BASE64"
          printf '%s' "$BIOGUARD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bioguard-release.jks"

      - name: Build signed release APK and AAB
        env:
          BIOGUARD_STORE_FILE: ${{ runner.temp }}/bioguard-release.jks
          BIOGUARD_STORE_PASSWORD: ${{ secrets.BIOGUARD_STORE_PASSWORD }}
          BIOGUARD_KEY_ALIAS: ${{ secrets.BIOGUARD_KEY_ALIAS }}
          BIOGUARD_KEY_PASSWORD: ${{ secrets.BIOGUARD_KEY_PASSWORD }}
          BIOGUARD_VERSION_CODE: ${{ github.run_number }}
          BIOGUARD_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature and generate checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK_PATH"
          (cd "$(dirname "$APK_PATH")" && sha256sum "$(basename "$APK_PATH")" > SHA256SUMS.txt)

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wearable-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wearable-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
